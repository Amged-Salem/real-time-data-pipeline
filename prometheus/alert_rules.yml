groups:
  - name: spark_alerts
    rules:
      - alert: SparkWorkerDown
        expr: metrics_master_aliveWorkers_Value{type="gauges"} < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spark Worker is DOWN"
          description: "No alive Spark workers detected for more than 1 minute."

      - alert: SparkMemoryHigh
        expr: metrics_worker_memUsed_MB_Value{type="gauges"} > 1800
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spark Worker memory is high"
          description: "Spark worker memory usage exceeded 1800MB for 2 minutes."

      - alert: SparkNoRunningApps
        expr: metrics_master_apps_Value{type="gauges"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No Spark applications running"
          description: "No Spark jobs have been running for 5 minutes."

  - name: kafka_alerts
    rules:
      - alert: KafkaDown
        expr: up{job="kafka-metrics"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka exporter is DOWN"
          description: "Cannot scrape Kafka metrics - broker may be down."

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag_sum > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group lag exceeded 1000 messages for 2 minutes."

  - name: postgres_alerts
    rules:
      - alert: PostgresDown
        expr: up{job="postgres-metrics"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is DOWN"
          description: "Cannot scrape PostgreSQL metrics."

      - alert: PostgresTooManyConnections
        expr: pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "Active connections exceeded 80 for 2 minutes."

  - name: pipeline_alerts
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target is DOWN"
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) has been down for 2 minutes."